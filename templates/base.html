<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QBar - QR Code Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
  </head>
  <body class="bg-gradient-to-br from-blue-50 via-indigo-50 to-slate-100 text-slate-800 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white border border-slate-200 rounded-3xl shadow-xl shadow-indigo-100 w-full max-w-md p-6 md:p-8 space-y-6">
      <div class="text-center space-y-1">
        <h1 class="text-2xl font-bold tracking-tight text-indigo-600"><i class="fa-solid fa-qrcode"></i> QBar</h1>
        <h1 class="text-xl font-bold tracking-tight text-slate-900">QR Code Generator</h1>
        <p class="text-sm text-slate-500">Enter URL and filename to create your QR code.</p>
      </div>

      <form method="POST" class="space-y-4">
        {% csrf_token %}
        <div>
          <label for="url" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5">Target URL</label>
          <input type="text" id="url" name="url" value="{{ url }}" required placeholder="https://example.com" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 text-slate-800 text-sm transition" />
        </div>

        <div>
          <label for="filename" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5">Filename</label>
          <input type="text" id="filename" name="filename" value="{{ filename }}" placeholder="my-qrcode" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 text-slate-800 text-sm transition" />
        </div>

        <button type="submit" class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-xl transition shadow-lg shadow-indigo-600/20 active:scale-[0.99]">Generate QR Code</button>
      </form>

      {% if qr_image %}
        <div class="pt-4 border-t border-slate-100 space-y-4 flex flex-col items-center">
          <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100 shadow-sm">
            <img src="data:image/png;base64,{{ qr_image }}" alt="Generated QR Code" class="rounded-xl mx-auto" />
          </div>

          <a href="data:image/png;base64,{{ qr_image }}" download="{{ filename|default:'qrcode' }}.png" class="w-full text-center py-3 px-4 bg-emerald-600 hover:bg-emerald-700 text-white font-medium rounded-xl transition shadow-lg shadow-emerald-600/20 active:scale-[0.99]">Download QR Code</a>
        </div>
      {% endif %}
    </div>
  </body>
</html>
